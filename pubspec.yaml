name: online_exam_system
description: Mobile Online Exam System frontend.
publish_to: "none"
version: 1.1.3+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.1.0
  riverpod_annotation: 4.0.0
  dio: 5.9.2
  pretty_dio_logger: 1.4.0
  go_router: 17.2.1
  flutter_secure_storage: 10.0.0
  shared_preferences: 2.5.5
  sqflite: 2.4.1
  path: 1.9.1
  file_picker: 10.3.3
  logger: 2.7.0
  noise_meter: 5.1.0
  audioplayers: 6.1.0
  record: 6.2.0
  path_provider: 2.1.5
  flutter_svg: 2.2.0
  package_info_plus: 9.0.0
  agora_rtc_engine: 6.5.3
  firebase_core: 4.15.2
  firebase_database: 12.6.1
  connectivity_plus: 6.1.4
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: 2.13.1
  riverpod_generator: 4.0.0+1
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo.png"
